# Builds the packages and runs KUnit. With a tag v<kernel>-<n> (e.g. v6.18.63-1), also
# publishes a release: the tag release.yml picked, which creates it, or one pushed by hand.
name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The release tag to create, v<kernel>-<n>
        type: string
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # A host path, not a volume, so actions/cache can keep ccache.
  OPI5_ARMBIAN_VOLUME: ${{ github.workspace }}/work/armbian
  KERNEL_GIT: shallow
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag against the kernel pin
        if: env.TAG != ''
        run: |
          kernel=$(sed -n 's/^declare -g KERNELBRANCH=tag:v//p' userpatches/config-opi5.conf)
          if [[ -z $kernel || $TAG != "v$kernel-"* || ! ${TAG#"v$kernel-"} =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::tag $TAG doesn't match the pinned kernel: expected v${kernel:-?}-<n>"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/armbian/cache/ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      # Armbian runs make under `env -i`, so the limit goes in ccache.conf.
      - name: Limit ccache
        run: |
          mkdir -p work/armbian/cache/ccache
          echo "max_size = 3G" > work/armbian/cache/ccache/ccache.conf

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Build
        run: mise run build -- SHOW_CCACHE=yes

      # Written as root in the container; actions/cache saves it as the runner.
      - name: Own ccache
        if: always()
        run: |
          if [[ -d work/armbian/cache/ccache ]]; then
            sudo chown -R "$(id -u):$(id -g)" work/armbian/cache/ccache
          fi

      # Boots the package's kernel in QEMU; the logs go into the uploaded out/kunit/.
      - name: KUnit
        run: mise run kunit

      - name: Add the userpatches tarball
        env:
          NAME: opi5-userpatches-${{ env.TAG || github.sha }}
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@"$(git log -1 --format=%ct)" \
            -czf "out/$NAME.tar.gz" userpatches
          (cd out && sha256sum linux-*.deb opi5-userpatches-*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opi5-kernel
          path: out/
          if-no-files-found: error

  release:
    needs: build
    if: inputs.tag || github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The history and tags, for the release notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: opi5-kernel
          path: out

      # Without a pushed tag, the release creates it at this commit. A tag created with
      # GITHUB_TOKEN starts no workflow, so this doesn't build twice.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum --check SHA256SUMS)
          tools/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            out/linux-*.deb out/opi5-userpatches-*.tar.gz out/SHA256SUMS
