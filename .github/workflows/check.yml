name: Check

on:
  push:
    branches: [main]
  pull_request:
  # Every third day too: it catches upstream breakage, and it uses the caches, which GitHub
  # evicts after 7 days unused.
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  KERNEL_GIT: shallow
  # A host path, not a volume, so actions/cache can keep Armbian's caches.
  OPI5_ARMBIAN_VOLUME: ${{ github.workspace }}/work/armbian

jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write # Deletes superseded caches.
    env:
      # The kernel git with patch.sh's patched result and key: with the same patches and
      # Armbian, patch.sh skips Armbian's patching (11 minutes). Worktrees aren't kept;
      # Armbian recreates them. Plus ccache for the drivers.
      CACHE_PATHS: |
        work/armbian/cache/git-bare
        !work/armbian/cache/git-bare/*/.git/worktrees
        work/armbian/cache/opi5-patch.key
        work/armbian/cache/ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3277a0f272901982804abc53abd93520db809be4 # v5.4.0

      - name: Lint
        run: mise run lint

      # From main's caches, which pull requests can read too.
      - name: Restore caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATHS }}
          key: check-${{ hashFiles('build.sh', 'userpatches/**') }}
          restore-keys: check-

      - name: Limit ccache
        run: |
          mkdir -p work/armbian/cache/ccache
          echo "max_size = 1G" > work/armbian/cache/ccache/ccache.conf

      - name: Apply the patches and compile the drivers
        run: mise run check

      # check regenerates it.
      - name: Committed overlays
        run: |
          if [[ -n $(git status --porcelain -- overlays) ]]; then
            git status --short -- overlays
            echo "::error::overlays/ differs from dt/: run mise run overlays and commit it"
            exit 1
          fi

      # On Renovate's bumps, also when the check failed: the report shows why.
      - name: Bump report
        if: ${{ !cancelled() && startsWith(github.head_ref, 'renovate/') }}
        run: mise run bump-report >> "$GITHUB_STEP_SUMMARY"

      # Only main saves: a pull request's caches are its own, and would only crowd out
      # main's under the repository's limit. Written as root in the container.
      - name: Own the caches
        if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" work/armbian/cache

      - if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Delete superseded caches
        if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.cache.outputs.cache-primary-key }}
        run: tools/cache-prune.sh check- "$KEY"

  # The package against Armbian's newest headers and DTB: on apt, and on beta, where they
  # land before apt. Edge, and beta outside the schedule, only warn.
  dkms:
    runs-on: ubuntu-26.04-arm
    continue-on-error: ${{ matrix.branch == 'edge' || (matrix.repo == 'beta' && github.event_name != 'schedule') }}
    strategy:
      fail-fast: false
      matrix:
        branch: [current, edge]
        repo: [apt]
        include:
          - branch: current
            repo: beta
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3277a0f272901982804abc53abd93520db809be4 # v5.4.0
        with:
          install: false

      - name: Build
        env:
          ARMBIAN_APT: https://${{ matrix.repo }}.armbian.com
        run: mise run dkms-check -- "linux-headers-${{ matrix.branch }}-rockchip64"

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dkms-check-${{ matrix.repo }}-${{ matrix.branch }}
          path: out/dkms-check/*/

  # A scheduled failure opens one issue (or comments on it); the next pass closes it.
  report:
    needs: [check, dkms]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Scheduled check failed
    steps:
      - run: |
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq ".[] | select(.title == env.TITLE) | .number" | head -1)
          if [[ $FAILED == true ]]; then
            body="$RUN failed against Armbian's newest packages. If a dkms job on apt failed, hold the kernel (\`apt-mark hold linux-image-current-rockchip64 linux-dtb-current-rockchip64 linux-headers-current-rockchip64\`) until it passes. If only beta's failed, fix the drivers before that kernel reaches apt."
            if [[ -n $issue ]]; then
              gh issue comment "$issue" --body "$RUN failed again."
            else
              gh issue create --title "$TITLE" --body "$body"
            fi
          elif [[ -n $issue ]]; then
            gh issue close "$issue" --comment "$RUN passed."
          fi

  # Restores build.yml's ccache, so it isn't evicted between weekly builds.
  keep-ccache:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/armbian/cache/ccache
          key: ccache-
          restore-keys: ccache-
