# Armbian's current kernel for the Orange Pi 5 Pro with Rockchip's MPP/RGA and RKNPU
# drivers: `./compile.sh opi5 kernel` in an armbian/build checkout at build.sh's commit.

declare -g BOARD=orangepi5pro
declare -g BRANCH=current
# A release, not Armbian's branch tip.
declare -g KERNELSOURCE=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
# renovate: datasource=git-tags depName=linux packageName=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
declare -g KERNELBRANCH=tag:v6.18.65
declare -g KERNEL_CONFIGURE=no

enable_extension opi5
